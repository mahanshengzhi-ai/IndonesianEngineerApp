name: Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: android-build-main-v4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user requests

      - name: Restore audio build cache
        uses: actions/cache@v5
        with:
          path: /tmp/indonesian-engineer-audio-cache
          key: indonesian-audio-v5-${{ hashFiles('app/src/main/assets/words_*.tsv', 'app/src/main/assets/sentences.tsv', 'app/src/main/assets/scenes.tsv', 'app/src/main/assets/letters.tsv') }}

      - name: Prepare bundled real audio
        timeout-minutes: 30
        run: AUDIO_CACHE_DIR=/tmp/indonesian-engineer-audio-cache python3 scripts/prepare_wikimedia_audio.py

      - name: Set up Gradle 8.13
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Validate content and forbidden APIs
        run: python3 scripts/validate_content.py

      - name: Build signed release APK
        run: gradle clean :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Verify APK alignment
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: IndonesianEngineer-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload audio audit data
        uses: actions/upload-artifact@v7
        with:
          name: IndonesianEngineer-audio
          path: |
            app/src/main/assets/tts_audio.m4a
            app/src/main/assets/tts_index.tsv
            app/src/main/assets/AUDIO_ATTRIBUTION.tsv
