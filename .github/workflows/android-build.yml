name: Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: android-build-main-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.13
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Validate content and forbidden APIs
        run: python3 scripts/validate_content.py

      - name: Build signed release APK
        run: gradle clean :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Verify APK alignment
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: IndonesianEngineer-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: IndonesianEngineer-release-metadata
          path: |
            app/build/outputs/mapping/release/**
            app/build/outputs/apk/release/output-metadata.json
