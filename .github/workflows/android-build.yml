name: Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: android-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.13
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Restore generated Indonesian audio cache
        id: audio-cache
        uses: actions/cache@v6
        with:
          path: |
            build/generated_audio
            app/src/main/assets/tts_audio.m4a
            app/src/main/assets/tts_index.tsv
          key: ${{ runner.os }}-indonesian-audio-${{ hashFiles('app/src/main/assets/words_*.tsv', 'app/src/main/assets/sentences.tsv', 'app/src/main/assets/scenes.tsv', 'app/src/main/assets/letters.tsv', 'scripts/generate_audio.py') }}

      - name: Install audio build tools
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-input edge-tts==7.2.8 mutagen
          ffmpeg -version | head -n 1

      - name: Generate bundled Indonesian audio
        if: steps.audio-cache.outputs.cache-hit != 'true'
        env:
          INDONESIAN_VOICE: id-ID-ArdiNeural
          INDONESIAN_RATE: -12%
          INDONESIAN_VOLUME: +0%
          INDONESIAN_PITCH: +0Hz
          AUDIO_CONCURRENCY: "8"
        run: python3 scripts/generate_audio.py

      - name: Ensure ffprobe is available for validation
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Verify bundled audio assets
        run: |
          test -s app/src/main/assets/tts_audio.m4a
          test -s app/src/main/assets/tts_index.tsv
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 app/src/main/assets/tts_audio.m4a
          python3 scripts/validate_content.py --strict-audio

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: IndonesianEngineer-debug
          path: app/build/outputs/apk/debug/*.apk
