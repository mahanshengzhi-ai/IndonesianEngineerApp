name: Indonesian Audio Audit

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: indonesian-audio-audit
  cancel-in-progress: true

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user requests

      - name: Restore audio cache
        uses: actions/cache@v5
        with:
          path: /tmp/indonesian-engineer-audio-cache
          key: indonesian-audio-v1-\${{ hashFiles('app/src/main/assets/words_*.tsv', 'app/src/main/assets/sentences.tsv', 'app/src/main/assets/scenes.tsv', 'app/src/main/assets/letters.tsv') }}

      - name: Prepare CC0 audio
        continue-on-error: true
        timeout-minutes: 3
        run: AUDIO_CACHE_DIR=/tmp/indonesian-engineer-audio-cache python3 scripts/prepare_wikimedia_audio.py

      - name: Validate content
        run: python3 scripts/validate_content.py

      - name: Upload audio audit
        uses: actions/upload-artifact@v7
        with:
          name: IndonesianEngineer-audio-audit
          path: |
            app/src/main/assets/tts_index.tsv
            app/src/main/assets/tts_audio.m4a
