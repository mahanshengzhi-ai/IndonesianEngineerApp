name: Android Foundation PR

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: android-foundation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache CC0 Indonesian audio sources
        uses: actions/cache@v4
        with:
          path: .cache/indonesian-audio
          key: indonesian-audio-v1-${{ hashFiles('scripts/build_audio_pack.py') }}
          restore-keys: |
            indonesian-audio-v1-

      - name: Install audio build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build real Indonesian audio pack
        run: |
          python scripts/build_audio_pack.py --min-lines 3000 --max-lines 3000
          python scripts/validate_audio_pack.py --min-lines 3000

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Validate Android foundation
        run: |
          gradle --version
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace


      - name: Upload audio audit
        uses: actions/upload-artifact@v7
        with:
          name: IndonesianEngineer-audio-audit
          path: |
            build/audio/audio_build_report.json
            build/audio/audio_validation_report.json
            app/src/main/assets/tts_index.tsv

      - name: Upload foundation APK
        uses: actions/upload-artifact@v7
        with:
          name: IndonesianEngineer-foundation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
