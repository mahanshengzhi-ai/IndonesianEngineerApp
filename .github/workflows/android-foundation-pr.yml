name: Android Foundation PR

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: android-foundation-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Validate Android foundation
        run: |
          gradle --version
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload foundation APK
        uses: actions/upload-artifact@v7
        with:
          name: IndonesianEngineer-foundation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
