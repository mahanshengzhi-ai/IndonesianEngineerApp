name: Vocabulary Quality Audit

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: vocabulary-quality-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run vocabulary quality audit
        run: python3 scripts/validate_vocabulary_quality.py
